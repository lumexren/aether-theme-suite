# Aether Dark - Starship Prompt Theme
format = """
$directory\
$git_branch\
$git_status\
$package\
$python\
$rust\
$nodejs\
$zig\
$cmd_duration\
$line_break\
$character"""

add_newline = false

[character]
success_symbol = "[❯](bold #3c78ff)"
error_symbol = "[❯](bold #f13460)"

[directory]
style = "bold #3c78ff"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #10a6d4"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #f13460"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "󰞋 "
stashed = "󰠦 "
modified = "󰛿 "
staged = "󰐗 "
renamed = "󰑕 "
deleted = "󰆴 "

[cmd_duration]
min_time = 2_000
style = "bold #f67400"
format = "took [$duration]($style) "

[python]
symbol = "󰌠 "
style = "bold #269e9c"
format = "via [$symbol$version]($style) "

[rust]
symbol = "󱘗 "
style = "bold #f67400"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = "󰎙 "
style = "bold #27ae60"
format = "via [$symbol$version]($style) "

[zig]
symbol = "󰟢 "
style = "bold #f67400"
format = "via [$symbol$version]($style) "
