# Aether Dark — Tmux theme
# Source from ~/.tmux.conf or ~/.config/tmux/tmux.conf:
#   source-file ~/.config/tmux/aether.conf

set -g status-position bottom
set -g status-style "bg=#0e0f13,fg=#abb2bf"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#ffffff,bg=#3c78ff,bold] #S #[fg=#3c78ff,bg=#0e0f13,nobold] "
set -g status-right "#[fg=#8e96a5,bg=#16181d] %Y-%m-%d %H:%M #[fg=#ffffff,bg=#10a6d4,bold] #H "

setw -g window-status-format "#[fg=#8e96a5,bg=#16181d] #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bg=#3c78ff,bold] #I:#W "
setw -g window-status-separator " "
setw -g window-status-activity-style "fg=#e5c07b,bg=#16181d"

set -g pane-border-style "fg=#1f2228"
set -g pane-active-border-style "fg=#3c78ff"

set -g message-style "bg=#1a1d24,fg=#f4f4f4"
set -g message-command-style "bg=#1a1d24,fg=#10a6d4"
set -g mode-style "bg=#3c78ff,fg=#ffffff,bold"

set -g display-panes-active-colour "#3c78ff"
set -g display-panes-colour "#3b404a"
set -g clock-mode-colour "#10a6d4"
