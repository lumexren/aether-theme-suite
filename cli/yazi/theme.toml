# Aether Dark — Yazi theme

[mgr]
cwd = { fg = "#10a6d4" }

hovered         = { fg = "#ffffff", bg = "#3c78ff", bold = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#e5c07b", bold = true, italic = true }
find_position = { fg = "#a673f5", bg = "reset", bold = true }

marker_copied   = { fg = "#269e9c", bg = "#269e9c" }
marker_cut      = { fg = "#f13460", bg = "#f13460" }
marker_marked   = { fg = "#10a6d4", bg = "#10a6d4" }
marker_selected = { fg = "#3c78ff", bg = "#3c78ff" }

count_copied   = { fg = "#111216", bg = "#269e9c" }
count_cut      = { fg = "#ffffff", bg = "#f13460" }
count_selected = { fg = "#ffffff", bg = "#3c78ff" }

border_symbol = "│"
border_style  = { fg = "#262a33" }

[tabs]
active   = { fg = "#ffffff", bg = "#3c78ff", bold = true }
inactive = { fg = "#8e96a5", bg = "#16181d" }

[mode]
normal_main = { fg = "#ffffff", bg = "#3c78ff", bold = true }
normal_alt  = { fg = "#6296ff", bg = "#1a1d24" }
select_main = { fg = "#111216", bg = "#10a6d4", bold = true }
select_alt  = { fg = "#10a6d4", bg = "#1a1d24" }
unset_main  = { fg = "#ffffff", bg = "#f13460", bold = true }
unset_alt   = { fg = "#f13460", bg = "#1a1d24" }

[status]
overall   = { fg = "#abb2bf", bg = "#0e0f13" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#3c78ff", bg = "#1f2228" }
progress_error  = { fg = "#f13460", bg = "#1f2228" }

perm_type  = { fg = "#3c78ff" }
perm_read  = { fg = "#e5c07b" }
perm_write = { fg = "#f13460" }
perm_exec  = { fg = "#269e9c" }
perm_sep   = { fg = "#5c6370" }

[which]
mask            = { bg = "#0c0d11" }
cand            = { fg = "#10a6d4" }
rest            = { fg = "#5c6370" }
desc            = { fg = "#abb2bf" }
separator       = "  "
separator_style = { fg = "#3b404a" }

[confirm]
border     = { fg = "#3c78ff" }
title      = { fg = "#10a6d4", bold = true }
content    = { fg = "#f4f4f4" }
list       = { fg = "#abb2bf" }
btn_yes    = { fg = "#ffffff", bg = "#3c78ff", bold = true }
btn_no     = { fg = "#abb2bf", bg = "#1a1d24" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#3c78ff" }
title    = { fg = "#10a6d4", bold = true }
tbl_col  = { fg = "#6296ff" }
tbl_cell = { fg = "#ffffff", bg = "#1a1d24" }

[notify]
title_info  = { fg = "#3c78ff" }
title_warn  = { fg = "#e5c07b" }
title_error = { fg = "#f13460" }

[pick]
border   = { fg = "#3c78ff" }
active   = { fg = "#ffffff", bg = "#3c78ff", bold = true }
inactive = { fg = "#abb2bf" }

[input]
border   = { fg = "#3c78ff" }
title    = { fg = "#10a6d4" }
value    = { fg = "#f4f4f4" }
selected = { reversed = true }

[cmp]
border   = { fg = "#3c78ff" }
active   = { fg = "#ffffff", bg = "#3c78ff" }
inactive = { fg = "#abb2bf" }

[tasks]
border  = { fg = "#3c78ff" }
title   = { fg = "#10a6d4" }
hovered = { fg = "#ffffff", bg = "#1a1d24" }

[help]
on      = { fg = "#10a6d4" }
run     = { fg = "#a673f5" }
desc    = { fg = "#abb2bf" }
hovered = { bg = "#1a1d24", bold = true }
footer  = { fg = "#8e96a5", bg = "#0e0f13" }

[filetype]
rules = [
  { mime = "image/*", fg = "#e5c07b" },
  { mime = "{audio,video}/*", fg = "#a673f5" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", fg = "#f13460" },
  { mime = "application/{pdf,doc,rtf}", fg = "#269e9c" },
  { name = "*", is = "orphan", fg = "#f13460", bold = true },
  { name = "*", is = "exec", fg = "#269e9c" },
  { name = "*/", fg = "#3c78ff", bold = true },
  { name = "*", fg = "#abb2bf" },
]
